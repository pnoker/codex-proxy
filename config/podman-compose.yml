services:
  codex-proxy:
    build:
      context: ..
      dockerfile: config/Dockerfile
    container_name: codex-proxy
    ports:
      - "8765:8765"
    volumes:
      - ${HOME}/.codex/config.toml:/home/appuser/.codex/config.toml:ro
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      - PYTHONUNBUFFERED=1
      - CODEX_PROXY_HOST=0.0.0.0
