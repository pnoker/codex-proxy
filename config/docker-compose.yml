services:
  codex-proxy:
    build:
      context: ..
      dockerfile: config/Dockerfile
    container_name: codex-proxy
    ports:
      - "8765:8765"
    volumes:
      - ${HOME}/.config/codex-proxy:/home/appuser/.config/codex-proxy:ro
      - ${HOME}/.codex/config.toml:/home/appuser/.codex/config.toml:ro
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service=codex-proxy"
    environment:
      - PYTHONUNBUFFERED=1
      - CODEX_PROXY_HOST=${CODEX_PROXY_HOST:-0.0.0.0}
      - CODEX_PROXY_LOG_LEVEL=${CODEX_PROXY_LOG_LEVEL:-INFO}