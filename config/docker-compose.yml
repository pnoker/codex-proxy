services:
  codex-proxy:
    build:
      context: ..
      dockerfile: config/Dockerfile
    container_name: codex-proxy
    ports:
      - "8765:8765"
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      - PYTHONUNBUFFERED=1
      - CODEX_PROXY_HOST=0.0.0.0
      - CODEX_PROXY_LOG_LEVEL=INFO
      - CODEX_PROXY_LOG_FILE=
