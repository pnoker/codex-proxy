[project]
name = "codex-proxy"
version = "0.2.0"
description = "An OpenAI Responses API proxy for Z.AI, DeepSeek, and Xiaomi providers."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "requests>=2.31.0",
    "urllib3>=2.0.0",
    "orjson>=3.9.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
codex-proxy = "codex_proxy.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/codex_proxy"]

[dependency-groups]
dev = [
    "pytest>=7.4.0",
    "responses>=0.23.0",
    "ruff>=0.1.0",
    "mypy>=1.7.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.ruff]
src = ["src"]
line-length = 100
target-version = "py312"
extend-exclude = [".venv", "logs", "scripts/custom_models.json"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "RUF", # ruff-specific
]
ignore = [
    "E501",  # line length handled by formatter
    "B008",  # function calls in default args (common with FastAPI/Click etc.)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B", "SIM"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true
no_implicit_optional = true
check_untyped_defs = true
exclude = ["^(\\.venv|logs|tests)/"]
